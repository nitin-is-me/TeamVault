spring.application.name=teamvault

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

application.security.jwt.secret-key=${JWT_SECRET}
# Default: 30 days (2592000000 ms). Override per environment with JWT_EXPIRATION.
# Note: tokens cannot be revoked server-side, so a shorter value limits exposure.
application.security.jwt.expiration=${JWT_EXPIRATION:2592000000}

# Tell Spring Boot that the default active profile is 'dev'.
# Production can override this with SPRING_PROFILES_ACTIVE.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Do not leak internal exception messages to clients.
server.error.include-message=never

# --- Email verification (HTTPS APIs; Render blocks outbound SMTP) ---
# provider: brevo (default, supports a single verified sender) or resend (needs a verified domain)
application.email.enabled=${EMAIL_ENABLED:true}
application.email.provider=${EMAIL_PROVIDER:brevo}
application.email.from=${EMAIL_FROM:TeamVault <no-reply@example.com>}

application.brevo.api-key=${BREVO_API_KEY:}
application.brevo.base-url=${BREVO_BASE_URL:https://api.brevo.com/v3}

application.resend.api-key=${RESEND_API_KEY:}
application.resend.base-url=${RESEND_BASE_URL:https://api.resend.com}

application.email.verification.code-ttl=${EMAIL_CODE_TTL:PT10M}
application.email.verification.resend-cooldown=${EMAIL_RESEND_COOLDOWN:PT60S}
application.email.verification.max-attempts=${EMAIL_MAX_ATTEMPTS:5}
