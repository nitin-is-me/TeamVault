spring.application.name=teamvault

# Tests run against an in-memory H2 database in PostgreSQL compatibility mode.
spring.datasource.url=jdbc:h2:mem:teamvault;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
application.security.jwt.expiration=3600000

# Tests never hit an email provider; a recording EmailSender captures the codes.
application.email.enabled=false
application.email.provider=brevo
application.brevo.api-key=
application.resend.api-key=
application.email.verification.code-ttl=PT10M
application.email.verification.resend-cooldown=PT60S
application.email.verification.max-attempts=5
